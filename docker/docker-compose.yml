name: seldon-base

networks:
  internal:
    external: false

volumes:
  db-data:

services:
  app:
    image: ${SELDON_IMAGE:-seldon-service:latest}
    command: bash entrypoints/docker-entrypoint.app.sh
    networks:
      internal:
        aliases:
          - ${WEB_APP_HOST}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - "slim_dev"

  # Alert intake: reads the brokers and records which detections are owed a
  # forecast; it runs no model. Same image as app.
  # SELDON_CONSUMER_PROCESSES replicas share the brokers' partitions in the
  # same consumer groups; each keeps its own CPU budget.
  consumer:
    image: ${SELDON_IMAGE:-seldon-service:latest}
    command: bash entrypoints/docker-entrypoint.consumer.sh
    deploy:
      replicas: ${SELDON_CONSUMER_PROCESSES:-1}
    networks:
      - internal
    restart: unless-stopped
    # SIGTERM stops it after the delivery in hand.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - "slim_dev"

  # Forecasts for one deployment: the reference model package. Its image is
  # the service plus that one package (the Dockerfile's worker target), and
  # the wheel digest it registers under is recorded in the image.
  # SELDON_FORECASTER_REPLICAS replicas share the owed work through leases.
  # Each replica's torch thread pool, set by the package from
  # SELDON_TORCH_THREADS, matches its CPU limit.
  forecaster-seldon-reference:
    image: seldon-forecaster-reference:latest
    command: python manage.py forecast_worker
    deploy:
      replicas: ${SELDON_FORECASTER_REPLICAS:-1}
    networks:
      - internal
    environment:
      SELDON_WORKER_PACKAGE: seldon-reference
      OMP_NUM_THREADS: ${SELDON_TORCH_THREADS:-1}
      SELDON_TORCH_THREADS: ${SELDON_TORCH_THREADS:-1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - "slim_dev"

  db:
    image: postgres:17
    networks:
      - internal
    # The first start initializes the database from these; DATABASE_* in the
    # env files is what the app connects with.
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles:
      - "slim_dev"
