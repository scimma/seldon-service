name: seldon-base

networks:
  internal:
    external: false

volumes:
  db-data:

services:
  app:
    image: ${SELDON_IMAGE:-seldon-service:latest}
    command: bash entrypoints/docker-entrypoint.app.sh
    networks:
      internal:
        aliases:
          - ${WEB_APP_HOST}
    environment:
      # Keep torch's thread pool equal to the CPU budget even before Django
      # starts; SELDON_TORCH_THREADS is applied again at app startup.
      OMP_NUM_THREADS: ${SELDON_TORCH_THREADS:-1}
      SELDON_TORCH_THREADS: ${SELDON_TORCH_THREADS:-1}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - "slim_dev"

  # Alert intake: reads the brokers and stores forecasts. Same image and
  # thread budget as app; it loads the model once and polls synchronously.
  consumer:
    image: ${SELDON_IMAGE:-seldon-service:latest}
    command: bash entrypoints/docker-entrypoint.consumer.sh
    networks:
      - internal
    environment:
      OMP_NUM_THREADS: ${SELDON_TORCH_THREADS:-1}
      SELDON_TORCH_THREADS: ${SELDON_TORCH_THREADS:-1}
    restart: unless-stopped
    # SIGTERM stops it after the delivery in hand; allow time for a forecast.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - "slim_dev"

  db:
    image: postgres:17
    networks:
      - internal
    # The first start initializes the database from these; DATABASE_* in the
    # env files is what the app connects with.
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles:
      - "slim_dev"
